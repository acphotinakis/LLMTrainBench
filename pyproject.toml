[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-flow"
version = "0.1.0"
description = "Reproducible FineWeb-Edu language-model training experiments on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lm-eval==0.4.13",
  "mlx-lm==0.32.0",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_flow"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

