schema_version: '1.0'
shared:
  framework: mlx
  model_id: Qwen/Qwen2.5-0.5B
  model_revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
  sequence_length: 1024
  dtype: bfloat16
  microbatch_sequences: 1
  accumulation_steps: 8
  effective_batch_tokens: 8192
  clip_gradient_norm: 1.0
  warmup_updates: 100
  schedule: cosine
  optimizer: adamw
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  checkpoint_updates: 250
  checkpoint_at_end: true
  final_partial_accumulation: flush
  seeds: [17, 42, 73]
performance_benchmark:
  warmup_updates: 50
  measured_updates: 300
  fresh_process_repetitions: 3
  reset_initial_model: true
  exclude_from_window: [model_loading, compilation, warmup, validation, checkpoint_writing, log_upload]
  include_in_window: [normal_batch_preparation]
profiles:
  full: {trainable: all, weight_decay: 0.1, peak_lr: 2.0e-5, final_lr: 2.0e-6}
  lora:
    trainable: adapters_only
    weight_decay: 0.0
    peak_lr: 1.0e-4
    final_lr: 1.0e-5
    layers: 24
    modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    rank: 16
    alpha: 8
    scale: 0.5
    dropout: 0.05
    frozen: [base, embeddings, normalization, lm_head]
  qlora:
    optional: true
    inherits: lora
    quantization: mlx_affine_4bit
    group_size: 64
    compute_dtype: bfloat16
    adapter_dtype: bfloat16
